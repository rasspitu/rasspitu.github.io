# RASSP website configuration
#
# Settings that affect the whole site. This file is NOT reloaded automatically
# by `jekyll serve`; restart the server after editing it.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "rassp" # _sass/theme/_rassp_light.scss and _rassp_dark.scss
title                    : "RASSP"
title_separator          : "-"
name                     : &name "RASSP Research Group"
description              : &description "RAdar and Sonar Signal Processing Research Group at Istanbul Technical University"
url                      : https://rasspitu.github.io
baseurl                  : ""
repository               : "rasspitu/rasspitu.github.io"

# Sidebar - describes the group, not a person. Empty fields are hidden.
author:
  avatar           : "rassp_icon.png"
  name             : "RASSP"
  pronouns         :
  bio              : "RAdar and Sonar Signal Processing Research Group"
  location         : "Istanbul, Türkiye"
  employer         : "Istanbul Technical University"
  uri              : "https://www.itu.edu.tr"
  email            : # TODO: group email address

  # Academic websites
  googlescholar    : # TODO: Google Scholar URL
  orcid            :
  researchgate     :

  # Repositories
  github           : "rasspitu"

  # Social media
  linkedin         : # TODO: LinkedIn username (optional)
  youtube          :

# Publication categories, in the order they are shown on the Publications page.
# The key must match the `category` field of the files in _publications/.
publication_category:
  journal:
    title: 'Journal Articles'
  conference:
    title: 'Conference Papers'
  preprint:
    title: 'Preprints'

# Number of latest items from _data/news.yml shown on the home page (0 to hide)
news_on_home             : 3

# Site Settings
teaser                  : "rassp_icon.png" # fallback image for social media previews
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  hide                   : true


# SEO Related
google_site_verification :
bing_site_verification   :


# Social Sharing
og_image                 : "rassp_icon.png"
og_description           : *description
social:
  type                   : Organization
  name                   : *name
  links:
    - "https://github.com/rasspitu"


# Analytics - disabled, the site uses no tracking
analytics:
  provider               : false


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CLAUDE.md
  - PROMPT.md
  - README.md
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - local
  - markdown_generator
  - node_modules
  - package.json*
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Europe/Istanbul


# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

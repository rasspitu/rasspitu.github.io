<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 260 260" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RASSP icon</title>
  <defs>
    <clipPath id="disc"><circle cx="150" cy="150" r="108"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2540"/><stop offset="1" stop-color="#16406A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B5566"/><stop offset="1" stop-color="#062A36"/>
    </linearGradient>
    <radialGradient id="sweep" cx="150" cy="150" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FA9F5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3FA9F5" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect x="30" y="30" width="240" height="130" fill="url(#sky)"/>
    <path d="M30 150 Q57.5 140 85 150 T140 150 T195 150 T250 150 T305 150 L305 280 L30 280 Z" fill="url(#sea)"/>
    <!-- radar sweep -->
    <path d="M150 150 L150 44 A106 106 0 0 1 210.8 63.2 Z" fill="url(#sweep)"/>
    <line x1="150" y1="150" x2="210.8" y2="63.2" stroke="#8FD0FF" stroke-width="2"/>
    <!-- radar wavefronts (up) -->
    <g fill="none" stroke="#3FA9F5" stroke-linecap="round" stroke-width="5">
      <path d="M124 135 A30 30 0 0 1 176 135"/>
      <path d="M102.4 122.5 A55 55 0 0 1 197.6 122.5" stroke-opacity="0.75"/>
      <path d="M80.7 110 A80 80 0 0 1 219.3 110" stroke-opacity="0.45"/>
    </g>
    <!-- sonar wavefronts (down) -->
    <g fill="none" stroke="#1FC7A6" stroke-linecap="round" stroke-width="5">
      <path d="M124 165 A30 30 0 0 0 176 165"/>
      <path d="M102.4 177.5 A55 55 0 0 0 197.6 177.5" stroke-opacity="0.75"/>
      <path d="M80.7 190 A80 80 0 0 0 219.3 190" stroke-opacity="0.45"/>
    </g>
    <!-- echoes / targets -->
    <circle cx="196" cy="84" r="9" fill="#8FD0FF" fill-opacity="0.25"/>
    <circle cx="196" cy="84" r="4.5" fill="#FFFFFF"/>
    <ellipse cx="108" cy="222" rx="13" ry="4.5" fill="#FFFFFF"/>
    <ellipse cx="108" cy="222" rx="21" ry="10" fill="none" stroke="#7FF0DA" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- waterline -->
    <path d="M30 150 Q57.5 140 85 150 T140 150 T195 150 T250 150 T305 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.5"/>
  </g>
  <!-- transceiver -->
  <circle cx="150" cy="150" r="9" fill="#FFFFFF"/>
  <circle cx="150" cy="150" r="4" fill="#0A2540"/>
  <!-- bezel -->
  <circle cx="150" cy="150" r="108" fill="none" stroke="#0A2540" stroke-width="8"/>
  <circle cx="150" cy="150" r="118" fill="none" stroke="#5B6B7F" stroke-width="1.5"/>
</svg>

# Group members. The People page groups them by role, in this order:
#   pi, faculty, phd, msc, undergrad, alumni
# and keeps the order of this file within each role.
#
# Fields (leave a field empty to hide it):
#   name        full name with correct Turkish characters, including academic title
#   title       position shown under the name
#   role        pi | faculty | phd | msc | undergrad | alumni
#   photo       file in /images/people/, square, at least 300x300 px (empty: default avatar)
#   email       e-mail address
#   scholar     Google Scholar profile URL
#   github      GitHub username
#   orcid       ORCID iD, e.g. 0000-0002-1825-0097
#   linkedin    LinkedIn username (the part after linkedin.com/in/)
#   website     personal or university page URL
#   bio         one or two sentences
#   start_year  year the person joined the group
#   placeholder true for example entries; they are hidden on the live site
#

- id: sar-isar
  title: "SAR and ISAR imaging"
  summary: >-
    We form synthetic aperture radar (SAR) and inverse synthetic aperture radar (ISAR) images from
    limited or incomplete measurements, using sparse recovery with nuclear norm minimization,
    plug-and-play ADMM with entropy-based thresholding, and deep image priors. We also collect SAR
    images with a low-cost radar mounted on a mini drone.
  image:
  image_alt:
  related_publications:

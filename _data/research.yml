    - 2023-07-01-synthetic-aperture-radar-imaging-using-a-low-cost-radar-moun
    - 2023-05-01-sparse-recovery-for-isar-imaging-via-nuclear-norm-minimizati

- id: target
  title: "Radar target detection, classification and direction finding"
  summary: >-
    We apply deep learning to radar detection and recognition: transformer networks for target
    detection, despeckling-based data augmentation for target classification, recurrent networks on
    range-Doppler maps for helicopter classification, and an encoder-decoder RetNet for interference
    mitigation in FMCW radar. For direction-of-arrival (DOA) estimation we study deep learning in
    MIMO radars and in the autocorrelation domain together with autoregressive modelling.
  image:
  image_alt:
  related_publications:

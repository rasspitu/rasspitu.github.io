- id: sonar
  title: "Sonar imaging and underwater object detection"
  summary: >-
    Below the waterline, we detect objects in forward-looking sonar images with transformer-guided
    image enhancement and cross-modality knowledge distillation, and we form synthetic aperture
    sonar (SAS) images from limited measurements with deep learning.

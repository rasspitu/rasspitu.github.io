- id: gpr
  title: "Ground penetrating radar: clutter removal and buried object detection"
  summary: >-
    GPR data are dominated by ground-surface reflections and clutter that mask the responses of
    buried objects. We develop clutter removal methods that range from low-rank and sparse models
    (robust matrix factorization, learned RPCA, learned dictionaries) to deep networks
    (convolutional autoencoders, vision transformers, B-spline activations), and we combine them
    with deep detectors, up to joint networks that remove clutter and detect buried objects at the
    same time. Related work covers recovering missing GPR measurements, clutter removal on FPGA,
    and tomographic GPR imaging of trees and cylindrical objects.
  image:
  image_alt:
  related_publications:

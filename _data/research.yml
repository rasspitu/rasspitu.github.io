- id: through-obstacle
  title: "Through-obstacle imaging and short-range radar sensing"
  summary: >-
    With low-cost, portable radar measurement systems we image what lies behind walls and inside
    structures. This includes background subtraction and wall mitigation with tensor RPCA and
    non-negative matrix factorization, imaging the interior of reinforced concrete, and detecting
    the vital signs of people in debris environments with stepped-frequency continuous-wave (SFCW)
    radar.

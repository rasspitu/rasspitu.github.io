- id: electronic-warfare
  title: "Electronic warfare and passive RF sensing"
  summary: >-
    For electronic support (ES) systems we study receiver search strategies based on randomized
    low-rank and sparse decomposition, time delay estimation, TDOA-based target localization and
    specific emitter identification with deep learning. We also process ADS-B signals, with a
    reliability-based decoder for low-SNR conditions and a neural network that separates
    overlapping signals.
